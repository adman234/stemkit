name: docker

# Builds the web/Docker version and publishes it to GHCR:
#   main        -> ghcr.io/<owner>/stemkit:latest
#   other branch -> ghcr.io/<owner>/stemkit:<branch>
#   tag v1.2.3  -> ghcr.io/<owner>/stemkit:1.2.3
# and the same again with -rocm on the end for the AMD (ROCm) image.
# Every image is started and has to answer before it is pushed. Renovate's
# branches are built and smoke tested but never pushed: a multi-GB image per
# dependency bump is what filled the registry
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'telemetry-worker/**'
  # Weekly rebuild so :latest picks up security fixes in the python/node base
  # images. Layers come from the registry cache, so if the base images haven't
  # changed nothing is re-downloaded by Unraid.
  schedule:
    - cron: '14 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # the image is only built from code that typechecks and passes its tests
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run web:typecheck
      - run: npm run test:audio
      - run: npm run web:test

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # cuda is the main image; rocm is the AMD one, tagged with a -rocm suffix
    # (latest-rocm, <branch>-rocm, ...). One failing does not stop the other
    strategy:
      fail-fast: false
      matrix:
        gpu: [cuda, rocm]
    steps:
      # GPU PyTorch makes the image several GB, so clear space on the runner first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=sha,format=short
          flavor: |
            suffix=${{ matrix.gpu == 'rocm' && '-rocm' || '' }},onlatest=true

      # built into the runner's docker first, so the image can be started
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GPU=${{ matrix.gpu }}
          tags: stemkit:smoke
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.gpu }}

      # no GPU on the runner, which the server takes in its stride: it has to
      # come up, answer /healthz, and find python, ffmpeg and the engine
      # scripts (/api/status ready)
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 stemkit:smoke
          fail() { echo "::error::$1"; docker logs smoke; exit 1; }
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8080/healthz >/dev/null || fail "the server never answered /healthz"
          status="$(curl -fs http://127.0.0.1:8080/api/status)" || fail "/api/status failed"
          echo "$status" | jq .
          echo "$status" | jq -e '.ready == true' >/dev/null || fail "the engine is not ready inside the image"
          docker rm -f smoke
          docker image rm stemkit:smoke

      # the same build again, all from the builder's cache, this time pushed
      - name: Push
        if: ${{ !startsWith(github.ref_name, 'renovate/') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GPU=${{ matrix.gpu }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps unchanged layers byte-identical between builds, so users only
          # re-download layers that actually changed. One cache per GPU flavour.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.gpu }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.gpu }},mode=max,image-manifest=true,oci-mediatypes=true
